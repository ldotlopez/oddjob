[project]
name = "oddjob"
version = "0.1.0"
description = "CLI toolkit for files: model-backed tasks (transcribe, speak, rewrite, summarize, translate, describe) through replaceable backends, plus image, video and file utilities."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Luis López", email = "luis@cuarentaydos.com" }]
keywords = [
    "cli",
    "transcription",
    "whisper",
    "text-to-speech",
    "llm",
    "ollama",
    "openai",
    "exif",
    "photos",
    "motion-photos",
    "image-processing",
    "ffmpeg",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Text Processing",
    "Topic :: Utilities",
]
requires-python = ">=3.13"
dependencies = [
    "platformdirs>=4.0",
    "rich>=13.0",
    "rich-click>=1.9",
    # A fixed commit of foundation (0.1.0), so a release installs the code it was
    # tested with; update it before tagging a release (README, "Releasing").
    "foundation @ git+https://github.com/ldotlopez/foundation@efc073c2fb7cc235341d46d5f45960da9dafd8bb",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "langcodes[data]>=3.5.1",
]

[project.urls]
Homepage = "https://github.com/ldotlopez/oddjob"
Repository = "https://github.com/ldotlopez/oddjob"
Issues = "https://github.com/ldotlopez/oddjob/issues"

# One entry point: every command is an `oddjob` subcommand.
[project.scripts]
oddjob = "oddjob.cli:cli"

# Which backend implements which task, readable without importing any
# backend (see docs/decisions/0001). One group per task; the entry point's
# name is the backend name and its value must be
# `oddjob.plugins.<module>:__oddjob_plugin__`. One module may provide several
# backends. Run `uv sync` after editing.
[project.entry-points."oddjob.backends.transcribe"]
whisper = "oddjob.plugins.whisper:__oddjob_plugin__"
whisper_cpp = "oddjob.plugins.whisper:__oddjob_plugin__"

[project.entry-points."oddjob.backends.speak"]
piper = "oddjob.plugins.piper:__oddjob_plugin__"

[project.entry-points."oddjob.backends.rewrite"]
llm = "oddjob.plugins.llm:__oddjob_plugin__"
ollama = "oddjob.plugins.ollama:__oddjob_plugin__"
openai = "oddjob.plugins.openai:__oddjob_plugin__"

[project.entry-points."oddjob.backends.summarize"]
llm = "oddjob.plugins.llm:__oddjob_plugin__"
ollama = "oddjob.plugins.ollama:__oddjob_plugin__"
openai = "oddjob.plugins.openai:__oddjob_plugin__"

[project.entry-points."oddjob.backends.expand"]
llm = "oddjob.plugins.llm:__oddjob_plugin__"
ollama = "oddjob.plugins.ollama:__oddjob_plugin__"
openai = "oddjob.plugins.openai:__oddjob_plugin__"

[project.entry-points."oddjob.backends.translate"]
llm = "oddjob.plugins.llm:__oddjob_plugin__"
ollama = "oddjob.plugins.ollama:__oddjob_plugin__"
openai = "oddjob.plugins.openai:__oddjob_plugin__"

[project.entry-points."oddjob.backends.describe"]
llm = "oddjob.plugins.llm:__oddjob_plugin__"
ollama = "oddjob.plugins.ollama:__oddjob_plugin__"
openai = "oddjob.plugins.openai:__oddjob_plugin__"

[project.optional-dependencies]
# Pillow-based image commands (img-hash, img-duplicates, img-check, img-trim,
# img-reduce).
images = [
    "pillow>=13.0.0",
    "pillow-heif>=1.8.1",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = true

# Two top-level packages: the tool and its backend-free core, filejobs
# (docs/decisions/0003).
[tool.setuptools.packages.find]
include = ["oddjob*", "filejobs*"]

[tool.ruff]
# Keep `ruff format .` out of Markdown code blocks (design docs are hand-aligned).
extend-exclude = ["*.md"]
