[project]
name = "glados"
version = "0.1.0"
description = "CLI toolkit applying model backends (whisper, whisper.cpp, OpenAI-compatible APIs, Ollama, llm) to file-based tasks: transcribe, rewrite, summarize, expand; plus multitool, file utilities for sidecars, motion photos, conversions, image hashes and renames."
requires-python = ">=3.13"
dependencies = [
    "platformdirs>=4.0",
    "rich>=13.0",
    "rich-click>=1.7",
    "foundation",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

# `glados <task> ...` is the multi-command entry point; each task is also
# installed as its own independent tool (e.g. `transcribe file.mp4`),
# matching how transcribe_sidecar.py worked standalone before this
# migration — both point at the exact same click.Command object.
[project.scripts]
glados = "glados.cli:cli"
transcribe = "glados.commands.transcribe:cli"
rewrite = "glados.commands.rewrite:cli"
summarize = "glados.commands.summarize:cli"
expand = "glados.commands.expand:cli"
# File utilities without the backend registry (docs/decisions/0003).
multitool = "multitool.cli:cli"

# Which backend implements which task, readable without importing any
# backend (see docs/decisions/0002). One group per task; the entry point's
# name is the backend name and its value must be
# `glados.plugins.<module>:__glados_plugin__`. One module may provide several
# backends. Run `uv sync` after editing.
[project.entry-points."glados.backends.transcribe"]
whisper = "glados.plugins.whisper:__glados_plugin__"
whisper_cpp = "glados.plugins.whisper:__glados_plugin__"

[project.entry-points."glados.backends.rewrite"]
llm = "glados.plugins.llm:__glados_plugin__"
ollama = "glados.plugins.ollama:__glados_plugin__"
openai = "glados.plugins.openai:__glados_plugin__"

[project.entry-points."glados.backends.summarize"]
llm = "glados.plugins.llm:__glados_plugin__"
ollama = "glados.plugins.ollama:__glados_plugin__"
openai = "glados.plugins.openai:__glados_plugin__"

[project.entry-points."glados.backends.expand"]
llm = "glados.plugins.llm:__glados_plugin__"
ollama = "glados.plugins.ollama:__glados_plugin__"
openai = "glados.plugins.openai:__glados_plugin__"

[project.optional-dependencies]
multitool = [
    "pillow>=13.0.0",
    "pillow-heif>=1.8.1",
]

# [build-system]
# requires = ["hatchling"]
# build-backend = "hatchling.build"

# [tool.hatch.build.targets.wheel]
# packages = ["src/glados"]

[tool.uv]
package = true

# Two top-level packages in one distribution (docs/decisions/0003).
[tool.setuptools.packages.find]
include = ["glados*", "multitool*"]

[tool.uv.sources]
foundation = { git = "https://github.com/ldotlopez/foundation.git", branch = "main" }

[tool.ruff]
# Keep `ruff format .` out of Markdown code blocks (design docs are hand-aligned).
extend-exclude = ["*.md"]
