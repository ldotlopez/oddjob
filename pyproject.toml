[project]
name = "glados"
version = "0.1.0"
description = "CLI toolkit applying LLM/model backends (whisper, OpenAI-compatible, llama.cpp, fastflowlm) to file-based tasks: transcribe, rewrite, summarize, expand, describe, tts."
requires-python = ">=3.13"
dependencies = [
    "platformdirs>=4.0",
    "rich>=13.0",
    "rich-click>=1.7",
    "foundation",
]

# `glados <task> ...` is the multi-command entry point; each task is also
# installed as its own independent tool (e.g. `transcribe file.mp4`),
# matching how transcribe_sidecar.py worked standalone before this
# migration — both point at the exact same click.Command object.
[project.scripts]
glados = "glados.cli:cli"
transcribe = "glados.tasks.transcribe:cli"
rewrite = "glados.tasks.rewrite:cli"
summarize = "glados.tasks.summarize:cli"
expand = "glados.tasks.expand:cli"

# [build-system]
# requires = ["hatchling"]
# build-backend = "hatchling.build"

# [tool.hatch.build.targets.wheel]
# packages = ["src/glados"]

[tool.uv]
package = true

[tool.uv.sources]
foundation = { git = "https://github.com/ldotlopez/foundation.git", branch = "main" }
