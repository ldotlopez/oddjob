[project]
name = "oddjob"
version = "0.1.0"
description = "CLI toolkit for files: model-backed tasks (transcribe, speak, rewrite, summarize, expand, translate, describe, audio-grep) through replaceable backends (whisper, whisper.cpp, piper, OpenAI-compatible APIs, Ollama, llm), and file utilities for sidecars, motion photos, conversions, image hashes, checks, crops, downscaling and captions, renames, extension fixes, date sync and OS-leftover cleanup."
requires-python = ">=3.13"
dependencies = [
    "platformdirs>=4.0",
    "rich>=13.0",
    "rich-click>=1.9",
    "foundation",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "langcodes[data]>=3.5.1",
]

# One entry point: every command is an `oddjob` subcommand.
[project.scripts]
oddjob = "oddjob.cli:cli"

# Which backend implements which task, readable without importing any
# backend (see docs/decisions/0002). One group per task; the entry point's
# name is the backend name and its value must be
# `oddjob.plugins.<module>:__oddjob_plugin__`. One module may provide several
# backends. Run `uv sync` after editing.
[project.entry-points."oddjob.backends.transcribe"]
whisper = "oddjob.plugins.whisper:__oddjob_plugin__"
whisper_cpp = "oddjob.plugins.whisper:__oddjob_plugin__"

[project.entry-points."oddjob.backends.speak"]
piper = "oddjob.plugins.piper:__oddjob_plugin__"

[project.entry-points."oddjob.backends.rewrite"]
llm = "oddjob.plugins.llm:__oddjob_plugin__"
ollama = "oddjob.plugins.ollama:__oddjob_plugin__"
openai = "oddjob.plugins.openai:__oddjob_plugin__"

[project.entry-points."oddjob.backends.summarize"]
llm = "oddjob.plugins.llm:__oddjob_plugin__"
ollama = "oddjob.plugins.ollama:__oddjob_plugin__"
openai = "oddjob.plugins.openai:__oddjob_plugin__"

[project.entry-points."oddjob.backends.expand"]
llm = "oddjob.plugins.llm:__oddjob_plugin__"
ollama = "oddjob.plugins.ollama:__oddjob_plugin__"
openai = "oddjob.plugins.openai:__oddjob_plugin__"

[project.entry-points."oddjob.backends.translate"]
llm = "oddjob.plugins.llm:__oddjob_plugin__"
ollama = "oddjob.plugins.ollama:__oddjob_plugin__"
openai = "oddjob.plugins.openai:__oddjob_plugin__"

[project.entry-points."oddjob.backends.describe"]
llm = "oddjob.plugins.llm:__oddjob_plugin__"
ollama = "oddjob.plugins.ollama:__oddjob_plugin__"
openai = "oddjob.plugins.openai:__oddjob_plugin__"

[project.optional-dependencies]
# Pillow-based image commands (img-hash, img-duplicates, img-check, img-trim,
# img-reduce).
images = [
    "pillow>=13.0.0",
    "pillow-heif>=1.8.1",
]

# [build-system]
# requires = ["hatchling"]
# build-backend = "hatchling.build"

# [tool.hatch.build.targets.wheel]
# packages = ["src/oddjob"]

[tool.uv]
package = true

# Two top-level packages: the tool and its backend-free core, filejobs
# (docs/decisions/0006).
[tool.setuptools.packages.find]
include = ["oddjob*", "filejobs*"]

[tool.uv.sources]
foundation = { git = "https://github.com/ldotlopez/foundation.git", branch = "main" }

[tool.ruff]
# Keep `ruff format .` out of Markdown code blocks (design docs are hand-aligned).
extend-exclude = ["*.md"]
