name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      # setup-uv publishes no floating major tags (no `v10`): pin a release.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install Python (from .python-version)
        run: uv python install

      - name: Install dependencies (with the images extra)
        run: uv sync --locked --all-extras

      # Integration tests skip themselves without ImageMagick, exiftool,
      # ffmpeg or tests/integration.env. PY_COLORS=0 stops rich-click from
      # forcing colored output under GITHUB_ACTIONS (see release.yml).
      - name: Run tests
        env:
          PY_COLORS: "0"
        run: uv run python -m unittest discover -s tests -v
